[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "practical-chat-agent"
version = "0.1.0"
description = "P0 skeleton for a practical multi-platform chat agent runtime."
readme = "docs/engineering_experiment_plan.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "PyMySQL>=1.1,<2.0",
  "python-dotenv>=1.0,<2.0",
  "typer>=0.12,<1.0",
]

[project.scripts]
practical-chat-agent = "practical_chat_agent.app.main:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
